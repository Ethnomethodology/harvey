<!DOCTYPE html>
<html>
<head>
<style>
  ul {
    list-style-type: disc;
    list-style-position: outside;
    padding-left: 0;
    margin-left: 0;
    border: 1px solid red;
  }
  li {
    font-size: 40px;
    margin-left: 1.5em; /* This is relative to li font size */
    border: 1px solid blue;
  }
</style>
</head>
<body>
  <ul>
    <li>Item 1</li>
  </ul>
</body>
</html>
