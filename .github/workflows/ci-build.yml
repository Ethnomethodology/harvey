name: CI Build (macOS & Windows)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag of your application to build'
        required: true
        default: 'main'

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        arch: [x64, arm64]
        exclude:
          - os: windows-latest
            arch: arm64
      fail-fast: false

    runs-on: ${{ matrix.os }}

    env:
      SIDECAR_REPO: dipanjan92/harvey-sidecars
      APP_NAME: harvey
      # --- Signing Environment Variables (Commented Out for Unsigned Builds) ---
      # TAURI_WINDOWS_PFX_SECRET: ${{ secrets.WINDOWS_PFX_BASE64 }}
      # TAURI_WINDOWS_PFX_PASSWORD_SECRET: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      # TAURI_APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      # TAURI_APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      # TAURI_APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      # TAURI_APPLE_DEVELOPER_TEAM_SECRET: ${{ secrets.APPLE_DEVELOPER_TEAM }}

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: >-
            ${{ matrix.os == 'macos-latest' && matrix.arch == 'x64' && 'x86_64-apple-darwin' ||
               matrix.os == 'macos-latest' && matrix.arch == 'arm64' && 'aarch64-apple-darwin' ||
               matrix.os == 'windows-latest' && matrix.arch == 'x64' && 'x86_64-pc-windows-msvc' }}
          override: true

      - name: Install Node.js & npm
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Fetch ffmpeg, whisper, diarize-cli from SIDECAR_REPO (v0.2.0)
        uses: robinraju/release-downloader@v1.10
        with:
          token: ${{ secrets.SIDECAR_TOKEN }}
          repository: ${{ env.SIDECAR_REPO }}
          tag: 'v0.2.0' 
          fileName: >-
            ${{ matrix.os == 'macos-latest' && matrix.arch == 'x64' && '*macos*x86_64*' ||
               matrix.os == 'macos-latest' && matrix.arch == 'arm64' && '*macos*arm64*' ||
               matrix.os == 'windows-latest' && matrix.arch == 'x64' && '*windows*x86_64*' }}
          downloadTo: ./sidecars
          # extract: true

      - name: Get Latest Pandoc Release Tag
        id: get_pandoc_tag
        run: |
          TAG_NAME=$(curl -sL https://api.github.com/repos/jgm/pandoc/releases/latest | jq -r .tag_name)
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" == "null" ] || [ "$TAG_NAME" == "" ]; then
            echo "Failed to fetch latest Pandoc tag. Using a fallback version: 3.2" # You can update this fallback
            TAG_NAME="3.2" 
          fi
          echo "PANDOC_LATEST_TAG=$TAG_NAME" >> $GITHUB_ENV
          echo "Using Pandoc Tag: $TAG_NAME"
        shell: bash

      - name: Download and Extract Pandoc (macOS)
        if: matrix.os == 'macos-latest'
        env:
          PANDOC_TAG: ${{ env.PANDOC_LATEST_TAG }}
        shell: bash
        run: |
          echo "Downloading Pandoc version $PANDOC_TAG for macOS..."
          mkdir -p ./sidecars ./temp_pandoc_extract
          # Use -f to fail on server errors, -S to show errors, -L to follow redirects
          curl -fSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_TAG}/pandoc-${PANDOC_TAG}-macOS.zip" -o pandoc_macos.zip
          
          echo "Validating downloaded Pandoc ZIP for macOS..."
          if ! unzip -tq pandoc_macos.zip > /dev/null; then
            echo "Error: Downloaded pandoc_macos.zip is not a valid zip file or is corrupted."
            # echo "Attempting to display first few lines of the downloaded file (might be an error page):"
            # head -n 20 pandoc_macos.zip # Be cautious if error pages are large
            exit 1
          fi
          
          echo "Extracting Pandoc for macOS..."
          unzip -q pandoc_macos.zip "pandoc-${PANDOC_TAG}/bin/pandoc" -d ./temp_pandoc_extract/
          mv "./temp_pandoc_extract/pandoc-${PANDOC_TAG}/bin/pandoc" ./sidecars/pandoc
          
          rm pandoc_macos.zip
          rm -rf ./temp_pandoc_extract
          echo "Pandoc executable for macOS prepared in ./sidecars/pandoc"

      - name: Download and Extract Pandoc (Windows)
        if: matrix.os == 'windows-latest'
        env:
          PANDOC_TAG: ${{ env.PANDOC_LATEST_TAG }}
        shell: bash
        run: |
          echo "Downloading Pandoc version $PANDOC_TAG for Windows..."
          mkdir -p ./sidecars ./temp_pandoc_extract
          # Use -f to fail on server errors, -S to show errors, -L to follow redirects
          curl -fSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_TAG}/pandoc-${PANDOC_TAG}-windows-x86_64.zip" -o pandoc_windows.zip

          echo "Validating downloaded Pandoc ZIP for Windows..."
          if ! unzip -tq pandoc_windows.zip > /dev/null; then
            echo "Error: Downloaded pandoc_windows.zip is not a valid zip file or is corrupted."
            # echo "Attempting to display first few lines of the downloaded file (might be an error page):"
            # head -n 20 pandoc_windows.zip # Be cautious if error pages are large
            exit 1
          fi

          echo "Extracting Pandoc for Windows..."
          unzip -q pandoc_windows.zip "pandoc-${PANDOC_TAG}/pandoc.exe" -d ./temp_pandoc_extract/
          mv "./temp_pandoc_extract/pandoc-${PANDOC_TAG}/pandoc.exe" ./sidecars/pandoc.exe
          
          rm pandoc_windows.zip
          rm -rf ./temp_pandoc_extract
          echo "Pandoc executable for Windows prepared in ./sidecars/pandoc.exe"

      - name: List all downloaded/extracted sidecar files
        run: |
          echo "Listing all files in ./sidecars before renaming:"
          ls -R ./sidecars
        shell: bash

      - name: Copy and rename sidecars
        run: |
          mkdir -p src-tauri/sidecar
          echo "Looking for files in ./sidecars to process..."
          
          find ./sidecars -type f -print0 | while IFS= read -r -d $'\0' file_path; do
            file_name=$(basename "$file_path")
            echo "Processing file: $file_path with basename: $file_name"
            target_name=""
            
            case "${{ matrix.os }}::${{ matrix.arch }}" in
              "macos-latest::x64") prefix="x86_64-apple-darwin" ;;
              "macos-latest::arm64") prefix="aarch64-apple-darwin" ;;
              "windows-latest::x64") prefix="x86_64-pc-windows-msvc" ;;
            esac

            ext=""
            if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
              if [[ "$file_name" != *.exe && ("$file_name" == *"ffmpeg"* || "$file_name" == *"whisper"* || "$file_name" == *"diarize"*) ]]; then
                 ext=".exe"
              elif [[ "$file_name" == "pandoc.exe" ]]; then
                 ext="" 
              fi
            fi
            
            if [[ "$file_name" == "pandoc" || "$file_name" == "pandoc.exe" ]]; then
              target_name="pandoc-$prefix" 
              if [[ "$file_name" == "pandoc.exe" ]]; then 
                target_name="pandoc-$prefix.exe"
              fi
            elif [[ "$file_name" == *"ffmpeg"* ]]; then target_name="ffmpeg-$prefix$ext"
            elif [[ "$file_name" == *"whisper"* ]]; then target_name="whisper-cpp-$prefix$ext"
            elif [[ "$file_name" == *"diarize"* ]]; then target_name="diarize-cli-$prefix$ext"
            fi

            if [[ -n "$target_name" ]]; then
              echo "Moving $file_path to src-tauri/sidecar/$target_name"
              mv "$file_path" "src-tauri/sidecar/$target_name"
            else
              echo "No matching rule for $file_name (from $file_path)"
            fi
          done
          
          echo "Contents of src-tauri/sidecar after renaming:"
          ls -l src-tauri/sidecar
        shell: bash

      - name: Mark executables (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "Marking executables in src-tauri/sidecar/"
          if [ -d "src-tauri/sidecar" ] && [ "$(ls -A src-tauri/sidecar)" ]; then
            chmod +x src-tauri/sidecar/*
            echo "Clearing extended attributes from sidecars (if any)..."
            xattr -c src-tauri/sidecar/* || echo "xattr -c: No attributes to clear or command not applicable, continuing."
          else
            echo "src-tauri/sidecar directory is empty or does not exist. Skipping."
          fi
        shell: bash

      - name: Build frontend
        run: |
          npm ci 
          npm run build

      - name: Build Tauri bundle (Unsigned)
        env:
          TAURI_SKIP_SIGNING: "true"
        run: |
          rustc --version
          cargo --version
          echo "Building for target: ${{ matrix.os == 'macos-latest' && (matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin') || (matrix.os == 'windows-latest' && matrix.arch == 'x64' && 'x86_64-pc-windows-msvc') }}"
          echo "Signing will be skipped (TAURI_SKIP_SIGNING=true)."
          
          cargo tauri build --target ${{ matrix.os == 'macos-latest' && (matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin') || (matrix.os == 'windows-latest' && matrix.arch == 'x64' && 'x86_64-pc-windows-msvc') }} --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.os }}-${{ matrix.arch }}-unsigned
          path: |
            src-tauri/target/${{ matrix.os == 'macos-latest' && (matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin') || (matrix.os == 'windows-latest' && matrix.arch == 'x64' && 'x86_64-pc-windows-msvc') }}/release/bundle/${{ matrix.os == 'macos-latest' && 'macos/*.app' || 'windows/*.msi' }}
            src-tauri/target/${{ matrix.os == 'macos-latest' && (matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin') || (matrix.os == 'windows-latest' && matrix.arch == 'x64' && 'x86_64-pc-windows-msvc') }}/release/bundle/${{ matrix.os == 'macos-latest' && 'macos/*.dmg' || 'windows/*.exe' }}