name: CI Build (macOS & Windows)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: true
        default: 'main'

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        arch: [x64, arm64]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    env:
      SIDECAR_REPO: dipanjan92/harvey-sidecars
      APP_NAME: harvey

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: >-
            ${{ matrix.os == 'macos-latest' && matrix.arch == 'x64' && 'x86_64-apple-darwin' ||
               matrix.os == 'macos-latest' && matrix.arch == 'arm64' && 'aarch64-apple-darwin' ||
               matrix.os == 'windows-latest' && 'x86_64-pc-windows-msvc' }}
          override: true

      - name: Install Node.js & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Fetch sidecar binaries & pandoc installers
        uses: dawidd6/action-download-release@v2
        with:
          token: ${{ secrets.SIDECAR_TOKEN }}
          repository: ${{ env.SIDECAR_REPO }}
          tag: ${{ github.event.inputs.ref }}
          pattern: >-
            ${{ matrix.os == 'macos-latest' && matrix.arch == 'x64' && '**/macos-x86_64/**' ||
               matrix.os == 'macos-latest' && matrix.arch == 'arm64' && '**/macos-arm64/**' ||
               matrix.os == 'windows-latest' && '**/windows-x86_64/**' }}
          output: sidecars

      - name: Copy and rename sidecars
        run: |
          mkdir -p src-tauri/sidecar
          for file in sidecars/**/*; do
            base=$(basename "$file")
            case "${{ matrix.os }}::${{ matrix.arch }}" in
              "macos-latest::x64")
                prefix="x86_64-apple-darwin"
                ;;
              "macos-latest::arm64")
                prefix="aarch64-apple-darwin"
                ;;
              "windows-latest::x64")
                prefix="x86_64-pc-windows-msvc.exe"
                ;;
            esac
            if [[ "$base" == *"ffmpeg"* ]]; then
              mv "$file" "src-tauri/sidecar/ffmpeg-$prefix"
            elif [[ "$base" == *"whisper"* ]]; then
              mv "$file" "src-tauri/sidecar/whisper-cpp-$prefix"
            elif [[ "$base" == *"diarize"* ]]; then
              mv "$file" "src-tauri/sidecar/diarize-cli-$prefix"
            elif [[ "$base" == *"pandoc"* ]]; then
              mv "$file" "src-tauri/sidecar/pandoc-$prefix"
            fi
          done
        shell: bash

      - name: Mark executables
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x src-tauri/sidecar/*
          xattr -rc src-tauri/sidecar/*
        shell: bash

      - name: Build frontend
        run: |
          yarn install
          yarn build

      - name: Build Tauri bundle
        run: |
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            cargo tauri build --target ${{ matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }} --release
          else
            cargo tauri build --target x86_64-pc-windows-msvc --release
          fi
        env:
          TAURI_SKIP_SIGN: "true"

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}/release/bundle/${{ matrix.os == 'macos-latest' && 'macos' || 'windows' }}/*