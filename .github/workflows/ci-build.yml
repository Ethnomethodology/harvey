name: CI Build (macOS & Windows)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag of your application to build'
        required: true
        default: 'main'

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        arch: [x64, arm64]
        exclude:
          - os: windows-latest
            arch: arm64
      fail-fast: false

    runs-on: ${{ matrix.os }}

    env:
      SIDECAR_REPO: dipanjan92/harvey-sidecars
      APP_NAME: harvey
      # --- Signing Environment Variables (Commented Out for Unsigned Builds) ---
      # TAURI_WINDOWS_PFX_SECRET: ${{ secrets.WINDOWS_PFX_BASE64 }}
      # TAURI_WINDOWS_PFX_PASSWORD_SECRET: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      # TAURI_APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      # TAURI_APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      # TAURI_APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      # TAURI_APPLE_DEVELOPER_TEAM_SECRET: ${{ secrets.APPLE_DEVELOPER_TEAM }}

    steps:
      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: >-
            ${{ matrix.os == 'macos-latest' && matrix.arch == 'x64' && 'x86_64-apple-darwin' ||
               matrix.os == 'macos-latest' && matrix.arch == 'arm64' && 'aarch64-apple-darwin' ||
               matrix.os == 'windows-latest' && matrix.arch == 'x64' && 'x86_64-pc-windows-msvc' }}
          override: true

      - name: Clean project
        run: cargo clean --manifest-path src-tauri/Cargo.toml

      - name: Install Node.js & npm
        uses: actions/setup-node@v4
        with:
          node-version: '24.1.0'
          cache: 'npm'

      - name: Prepare sidecar directory
        run: mkdir -p ./sidecar

      - name: Fetch ffmpeg, whisper, diarize-cli from SIDECAR_REPO (v0.2.0)
        uses: robinraju/release-downloader@v1.10
        with:
          token: ${{ secrets.SIDECAR_TOKEN }}
          repository: ${{ env.SIDECAR_REPO }}
          tag: 'v0.2.0' 
          fileName: |
            ${{ matrix.os == 'macos-latest' && matrix.arch == 'x64' && 'diarize-cli-macos-x86_64' || '' }}
            ${{ matrix.os == 'macos-latest' && matrix.arch == 'x64' && 'ffmpeg-macos-x86_64' || '' }}
            ${{ matrix.os == 'macos-latest' && matrix.arch == 'x64' && 'whisper-cpp-macos-x86_64' || '' }}
            ${{ matrix.os == 'macos-latest' && matrix.arch == 'arm64' && 'diarize-cli-macos-arm64' || '' }}
            ${{ matrix.os == 'macos-latest' && matrix.arch == 'arm64' && 'ffmpeg-macos-arm64' || '' }}
            ${{ matrix.os == 'macos-latest' && matrix.arch == 'arm64' && 'whisper-cpp-macos-arm64' || '' }}
            ${{ matrix.os == 'windows-latest' && matrix.arch == 'x64' && 'diarize-cli-windows-x86_64.exe' || '' }}
            ${{ matrix.os == 'windows-latest' && matrix.arch == 'x64' && 'ffmpeg-windows-x86_64.exe' || '' }}
            ${{ matrix.os == 'windows-latest' && matrix.arch == 'x64' && 'whisper-cpp-windows-x86_64.exe' || '' }}
          out-file-path: ./sidecar
          extract: true

      - name: Verify SHA256 Checksums
        shell: bash
        run: |
          echo "Verifying checksums for downloaded sidecars in ./sidecar..."
          cd ./sidecar || exit 1

          verify_checksum() {
            local file_path="$1"
            local expected_checksum="$2"
            local actual_checksum=""

            if [[ ! -f "$file_path" ]]; then
              echo "Error: File $file_path not found for checksum verification."
              exit 1
            fi

            if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
              # Iterate to find the line with the hash, as certutil output can vary
              output=$(certutil -hashfile "$file_path" SHA256)
              while IFS= read -r line; do
                if [[ "$line" =~ ^[0-9a-fA-F]{64}$ ]]; then # Look for a line that is exactly 64 hex characters
                  actual_checksum=$(echo "$line" | tr '[:upper:]' '[:lower:]' | sed 's/ //g')
                  break
                fi
              done <<< "$output"
              if [[ -z "$actual_checksum" ]]; then
                echo "Error: Could not extract checksum for $file_path from certutil output:"
                echo "$output"
                exit 1
              fi
            else # macos-latest
              actual_checksum=$(shasum -a 256 "$file_path" | awk '{print $1}')
            fi

            # Convert expected checksum to lowercase for consistent comparison
            expected_checksum=$(echo "$expected_checksum" | tr '[:upper:]' '[:lower:]')

            echo "File: $file_path, Expected: $expected_checksum, Actual: $actual_checksum"
            if [[ "$actual_checksum" != "$expected_checksum" ]]; then
              echo "Error: Checksum mismatch for $file_path."
              echo "Expected: $expected_checksum"
              echo "Actual:   $actual_checksum"
              exit 1
            else
              echo "Checksum verified for $file_path"
            fi
          }

          # Define expected checksums (from issue description, converted to lowercase)
          # diarize-cli
          DIARIZE_MAC_ARM64_SHA="44e82634cf317d79e267e6b33d98d536bdde466f7dc61a3130fbda93e6351aa7"
          DIARIZE_MAC_X64_SHA="5436a46e80e825c9dd7463145c7bf5ad2442dafacea19a68fe0867d54aa1b0bb"
          DIARIZE_WIN_X64_SHA="46f1a400795ebdcb59b163ad1eed9bbb55bac5fd9f0a0c1bbcac3c4a255f1984"
          # ffmpeg
          FFMPEG_MAC_ARM64_SHA="8d5d9087ae4e410ae489fa53e0399b8464e1c70a037649e7c1f4e0a5522cffe2"
          FFMPEG_MAC_X64_SHA="77b1a3f7ee02a0df27bed19361c9dd6334ebce5cc08d92ddf6b25a3cf71027b6"
          FFMPEG_WIN_X64_SHA="81f3323f88ff7576da73492aa0a867af15a1314d6209e5aed9e91bd2c27ad47c"
          # whisper-cpp
          WHISPER_MAC_ARM64_SHA="e643aa54826743b03acd8bcc326e9b5f53f90fcc59d6a765860f0264a0a3b812"
          WHISPER_MAC_X64_SHA="e643aa54826743b03acd8bcc326e9b5f53f90fcc59d6a765860f0264a0a3b812" # Note: x64 and arm64 have the same SHA
          WHISPER_WIN_X64_SHA="1aa98e75f9a3dab37973bd26946b643761d83573b23c1815193de9fcd72c7229"

          if [[ "${{ matrix.os }}" == "macos-latest" && "${{ matrix.arch }}" == "arm64" ]]; then
            verify_checksum "diarize-cli-macos-arm64" "$DIARIZE_MAC_ARM64_SHA"
            verify_checksum "ffmpeg-macos-arm64" "$FFMPEG_MAC_ARM64_SHA"
            verify_checksum "whisper-cpp-macos-arm64" "$WHISPER_MAC_ARM64_SHA"
          elif [[ "${{ matrix.os }}" == "macos-latest" && "${{ matrix.arch }}" == "x64" ]]; then
            verify_checksum "diarize-cli-macos-x86_64" "$DIARIZE_MAC_X64_SHA"
            verify_checksum "ffmpeg-macos-x86_64" "$FFMPEG_MAC_X64_SHA"
            verify_checksum "whisper-cpp-macos-x86_64" "$WHISPER_MAC_X64_SHA"
          elif [[ "${{ matrix.os }}" == "windows-latest" && "${{ matrix.arch }}" == "x64" ]]; then
            verify_checksum "diarize-cli-windows-x86_64.exe" "$DIARIZE_WIN_X64_SHA"
            verify_checksum "ffmpeg-windows-x86_64.exe" "$FFMPEG_WIN_X64_SHA"
            verify_checksum "whisper-cpp-windows-x86_64.exe" "$WHISPER_WIN_X64_SHA"
          fi
          cd ..
          echo "All sidecar checksums verified successfully."

      - name: Get Latest Pandoc Release Tag
        id: get_pandoc_tag
        run: |
          LATEST_PANDOC_JSON=$(curl -sL https://api.github.com/repos/jgm/pandoc/releases/latest)
          TAG_NAME=$(echo "$LATEST_PANDOC_JSON" | jq -r .tag_name)
          
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" == "null" ] || [ "$TAG_NAME" == "" ]; then
            echo "Failed to fetch latest Pandoc tag dynamically. API response: $LATEST_PANDOC_JSON"
            echo "Using a fallback version: 3.7.0.1" 
            TAG_NAME="3.7.0.1" 
          fi
          echo "PANDOC_LATEST_TAG=$TAG_NAME" >> $GITHUB_ENV
          echo "Using Pandoc Tag: $TAG_NAME"
        shell: bash

      - name: Download and Extract Pandoc (macOS)
        if: matrix.os == 'macos-latest'
        env:
          PANDOC_TAG: ${{ env.PANDOC_LATEST_TAG }}
        shell: bash
        run: |
          # Determine architecture suffix
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            ARCH_DIR_SUFFIX="arm64"
          else
            ARCH_DIR_SUFFIX="x86_64"
          fi

          ZIP="pandoc-${PANDOC_TAG}-${ARCH_DIR_SUFFIX}-macOS.zip"
          URL="https://github.com/jgm/pandoc/releases/download/${PANDOC_TAG}/${ZIP}"
          echo "Downloading $ZIP..."
          curl -fSL "$URL" -o pandoc_macos.zip

          echo "Extracting pandoc archive..."
          mkdir -p ./sidecar ./temp_pandoc_extract
          unzip -q pandoc_macos.zip -d ./temp_pandoc_extract/

          # Find the pandoc binary anywhere under temp_pandoc_extract
          PANDOC_BIN=$(find ./temp_pandoc_extract -type f -name pandoc | head -n1)
          if [[ -z "$PANDOC_BIN" ]]; then
            echo "Error: pandoc binary not found in extraction."
            ls -R ./temp_pandoc_extract
            exit 1
          fi

          echo "Moving pandoc from $PANDOC_BIN to ./sidecar/pandoc"
          mv "$PANDOC_BIN" ./sidecar/pandoc

          # Clean up
          rm pandoc_macos.zip
          rm -rf ./temp_pandoc_extract

      - name: Download and Extract Pandoc (Windows)
        if: matrix.os == 'windows-latest'
        env:
          PANDOC_TAG: ${{ env.PANDOC_LATEST_TAG }}
        shell: bash
        run: |
          PANDOC_ZIP_FILENAME="pandoc-${PANDOC_TAG}-windows-x86_64.zip"
          PANDOC_DOWNLOAD_URL="https://github.com/jgm/pandoc/releases/download/${PANDOC_TAG}/${PANDOC_ZIP_FILENAME}"

          echo "Downloading Pandoc version $PANDOC_TAG for Windows (x86_64)..."
          echo "Download URL: $PANDOC_DOWNLOAD_URL"
          mkdir -p ./sidecar ./temp_pandoc_extract
          
          curl -fSL "$PANDOC_DOWNLOAD_URL" -o pandoc_windows.zip

          echo "Validating downloaded Pandoc ZIP for Windows..."
          if ! unzip -tq pandoc_windows.zip > /dev/null; then
            echo "Error: Downloaded pandoc_windows.zip ($PANDOC_ZIP_FILENAME) is not a valid zip file or is corrupted."
            exit 1
          fi

          echo "Extracting all from Pandoc ZIP for Windows to ./temp_pandoc_extract/"
          unzip -q pandoc_windows.zip -d ./temp_pandoc_extract/

          EXPECTED_PANDOC_PATH="./temp_pandoc_extract/pandoc-${PANDOC_TAG}/pandoc.exe"
          echo "Looking for Pandoc binary at: $EXPECTED_PANDOC_PATH"
          
          if [ -f "$EXPECTED_PANDOC_PATH" ]; then
            mv "$EXPECTED_PANDOC_PATH" ./sidecar/pandoc.exe
          else
            echo "Error: Pandoc binary not found at $EXPECTED_PANDOC_PATH after extraction."
            echo "Contents of ./temp_pandoc_extract/:"
            ls -R ./temp_pandoc_extract/ 
            exit 1
          fi
          
          rm pandoc_windows.zip
          rm -rf ./temp_pandoc_extract
          echo "Pandoc executable for Windows prepared in ./sidecar/pandoc.exe"

      - name: List all downloaded/extracted sidecar files
        run: |
          echo "Listing all files in ./sidecar before renaming:"
          ls -R ./sidecar
        shell: bash

      - name: Clean target sidecar directory
        run: |
          echo "Cleaning src-tauri/sidecar/ directory..."
          if [ -d "src-tauri/sidecar" ]; then
            # Remove contents of sidecar directory.
            # Using find to delete contents to avoid issues if sidecar itself is a symlink or special.
            find src-tauri/sidecar/ -mindepth 1 -delete
            echo "src-tauri/sidecar/ cleaned."
          else
            echo "src-tauri/sidecar/ directory does not exist, skipping cleanup."
          fi
        shell: bash

      - name: Copy and rename sidecars
        run: |
          mkdir -p src-tauri/sidecar src-tauri/models
          echo "Looking for files in ./sidecar to process..."
          
          find ./sidecar -type f -print0 | while IFS= read -r -d $'\0' file_path; do
            file_name=$(basename "$file_path")
            echo "Processing file: $file_path with basename: $file_name"
            target_name=""
            
            case "${{ matrix.os }}::${{ matrix.arch }}" in
              "macos-latest::x64") prefix="x86_64-apple-darwin" ;;
              "macos-latest::arm64") prefix="aarch64-apple-darwin" ;;
              "windows-latest::x64") prefix="x86_64-pc-windows-msvc" ;;
            esac

            ext=""
            if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
              if [[ "$file_name" == *"ffmpeg"* || "$file_name" == *"whisper"* || "$file_name" == *"diarize"* ]]; then
                 ext=".exe"
              elif [[ "$file_name" == "pandoc.exe" ]]; then
                 ext=""
              fi
            fi
            
            if [[ "$file_name" == "pandoc" || "$file_name" == "pandoc.exe" ]]; then
              target_name="pandoc-$prefix" 
              if [[ "$file_name" == "pandoc.exe" ]]; then 
                target_name="pandoc-$prefix.exe"
              fi
            elif [[ "$file_name" == *"ffmpeg"* ]]; then target_name="ffmpeg-$prefix$ext"
            elif [[ "$file_name" == *"whisper"* ]]; then target_name="whisper-cpp-$prefix$ext"
            elif [[ "$file_name" == *"diarize"* ]]; then target_name="diarize-cli-$prefix$ext"
            fi

            if [[ -n "$target_name" ]]; then
              echo "Moving $file_path to src-tauri/sidecar/$target_name"
              mv "$file_path" "src-tauri/sidecar/$target_name"
            else
              echo "No matching rule for $file_name (from $file_path)"
            fi
          done
          
          echo "Contents of src-tauri/sidecar after renaming:"
          ls -l src-tauri/sidecar
        shell: bash

      - name: Mark executables (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "Marking executables in src-tauri/sidecar/"
          if [ -d "src-tauri/sidecar" ] && [ "$(ls -A src-tauri/sidecar)" ]; then
            chmod +x src-tauri/sidecar/*
            echo "Clearing extended attributes from sidecars (if any)..."
            xattr -c src-tauri/sidecar/* || echo "xattr -c: No attributes to clear or command not applicable, continuing."
          else
            echo "src-tauri/sidecar directory is empty or does not exist. Skipping."
          fi
        shell: bash

      - name: Clean frontend build directory
        run: rm -rf build/
        shell: bash

      - name: Build frontend
        run: |
          npm ci 
          npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Tauri bundle
        env:
          TAURI_SKIP_SIGNING: "true"
        run: |
          rustc --version
          cargo --version
          echo "Building for target: ${{ matrix.os == 'macos-latest' && (matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin') || (matrix.os == 'windows-latest' && matrix.arch == 'x64' && 'x86_64-pc-windows-msvc') }}"
          echo "Signing will be skipped (TAURI_SKIP_SIGNING=true)."
          
          cargo tauri build --target ${{ matrix.os == 'macos-latest' && (matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin') || (matrix.os == 'windows-latest' && matrix.arch == 'x64' && 'x86_64-pc-windows-msvc') }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.os == 'macos-latest' && (matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin') || (matrix.os == 'windows-latest' && matrix.arch == 'x64' && 'x86_64-pc-windows-msvc') }}/release/bundle/${{ matrix.os == 'macos-latest' && 'macos/*.app' || 'msi/*.msi' }}
            src-tauri/target/${{ matrix.os == 'macos-latest' && (matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin') || (matrix.os == 'windows-latest' && matrix.arch == 'x64' && 'x86_64-pc-windows-msvc') }}/release/bundle/${{ matrix.os == 'macos-latest' && 'dmg/*.dmg' || 'nsis/*.exe' }}

      - name: Ensure GitHub Release exists
        id: ensure_release
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const tag = '${{ github.event.inputs.ref }}';
            try {
              const rel = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              return rel.data.upload_url;
            } catch {
              const rel = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Release ${tag}`,
                draft: false,
                prerelease: false
              });
              return rel.data.upload_url;
            }

      - name: Find Windows MSI
        if: matrix.os == 'windows-latest'
        id: find_msi
        run: |
          msi_path=$(ls src-tauri/target/${{ matrix.os == 'windows-latest' && matrix.arch == 'x64' && 'x86_64-pc-windows-msvc' }}/release/bundle/msi/*.msi)
          msi_name=$(basename "$msi_path")
          echo "msi_path=$msi_path" >> $GITHUB_OUTPUT
          echo "msi_name=$msi_name" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload Windows MSI
        if: matrix.os == 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.ensure_release.outputs.result }}
          asset_path: ${{ steps.find_msi.outputs.msi_path }}
          asset_name: ${{ steps.find_msi.outputs.msi_name }}
          asset_content_type: application/octet-stream

      - name: Find Windows NSIS Installer
        if: matrix.os == 'windows-latest'
        id: find_nsis
        run: |
          exe_path=$(ls src-tauri/target/${{ matrix.os == 'windows-latest' && matrix.arch == 'x64' && 'x86_64-pc-windows-msvc' }}/release/bundle/nsis/*.exe)
          exe_name=$(basename "$exe_path")
          echo "nsis_path=$exe_path" >> $GITHUB_OUTPUT
          echo "nsis_name=$exe_name" >> $GITHUB_OUTPUT
        shell: bash


      - name: Zip Windows NSIS Installer
        if: matrix.os == 'windows-latest'
        id: zip_windows_nsis
        shell: pwsh
        run: |
          $nsisPath = '${{ steps.find_nsis.outputs.nsis_path }}'
          $dir = Split-Path $nsisPath
          $exeName = Split-Path $nsisPath -Leaf
          $zipName = $exeName -replace '\.exe$', '.zip'
          $zipPath = Join-Path $dir $zipName
          Compress-Archive -Path $nsisPath -DestinationPath $zipPath -Force
          "zip_name=$zipName" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Windows NSIS Zip
        if: matrix.os == 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.ensure_release.outputs.result }}
          asset_path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/${{ steps.zip_windows_nsis.outputs.zip_name }}
          asset_name: ${{ steps.zip_windows_nsis.outputs.zip_name }}
          asset_content_type: application/zip

      - name: Find macOS DMG
        if: matrix.os == 'macos-latest'
        id: find_dmg
        run: |
          dmg_path=$(ls src-tauri/target/${{ matrix.os == 'macos-latest' && (matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin') }}/release/bundle/dmg/*.dmg)
          dmg_name=$(basename "$dmg_path")
          echo "dmg_path=$dmg_path" >> $GITHUB_OUTPUT
          echo "dmg_name=$dmg_name" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload macOS DMG
        if: matrix.os == 'macos-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.ensure_release.outputs.result }}
          asset_path: ${{ steps.find_dmg.outputs.dmg_path }}
          asset_name: ${{ steps.find_dmg.outputs.dmg_name }}
          asset_content_type: application/octet-stream

      - name: Zip macOS App
        if: matrix.os == 'macos-latest'
        id: zip_macos_app
        env:
          DMG_NAME: ${{ steps.find_dmg.outputs.dmg_name }}
        run: |
          BUNDLE_DIR=src-tauri/target/${{ matrix.os == 'macos-latest' && (matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin') }}/release/bundle
          cd "$BUNDLE_DIR"
          zip_name="${DMG_NAME%.dmg}.zip"
          zip -r "$zip_name" "macos/${{ env.APP_NAME }}.app"
          echo "zip_name=$zip_name" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload macOS App Zip
        if: matrix.os == 'macos-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.ensure_release.outputs.result }}
          asset_path: src-tauri/target/${{ matrix.os == 'macos-latest' && (matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin') }}/release/bundle/${{ steps.zip_macos_app.outputs.zip_name }}
          asset_name: ${{ steps.zip_macos_app.outputs.zip_name }}
          asset_content_type: application/zip