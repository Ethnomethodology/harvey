name: 'CI: Build Linux (ARM64)'

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src-tauri/**'
      - '.github/workflows/ci-build-linux-arm64.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src-tauri/**'
      - '.github/workflows/ci-build-linux-arm64.yml'

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
  TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: aarch64-unknown-linux-gnu

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Build application
        uses: tauri-apps/tauri-action@v0
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        with:
          command: cargo tauri build --target aarch64-unknown-linux-gnu
          args: ''
          tagName: app-v__VERSION__ # the action automatically replaces `__VERSION__` with the app version.
          packagePath: 'src-tauri'
          distPath: '../src'
          iconPath: 'icons/icon.icns'
          includeDebug: false
