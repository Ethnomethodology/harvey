name: CI Build (Linux x64)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag of your application to build'
        required: true
        default: 'main'

env:
  APP_NAME: harvey

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Set target triple
        id: set_target
        run: |
          echo "triple=x86_64-unknown-linux-gnu" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ steps.set_target.outputs.triple }}
          override: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev

      - name: Install Node.js & npm
        uses: actions/setup-node@v4
        with:
          node-version: '24.1.0'

      - name: Clean and Install frontend dependencies
        run: |
          rm -rf build/
          npm install
          npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.0.0 --locked

      - name: Build Tauri application
        env:
          TAURI_SKIP_SIGNING: "true"
        run: |
          echo "Building for target: ${{ steps.set_target.outputs.triple }}"
          echo "The build.rs script will now build whisper.cpp from source. FFmpeg is sourced from Conda Forge."
          cargo tauri build --target ${{ steps.set_target.outputs.triple }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux-x64
          path: |
            src-tauri/target/${{ steps.set_target.outputs.triple }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ steps.set_target.outputs.triple }}/release/bundle/deb/*.deb

      - name: Ensure GitHub Release exists
        id: ensure_release
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const tag = '${{ github.event.inputs.ref }}';
            try {
              const rel = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              return rel.data.upload_url;
            } catch {
              const rel = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Release ${tag}`,
                draft: false,
                prerelease: false
              });
              return rel.data.upload_url;
            }

      - name: Find AppImage
        id: find_appimage
        run: |
          appimage_path=$(ls src-tauri/target/${{ steps.set_target.outputs.triple }}/release/bundle/appimage/*.AppImage)
          appimage_name=$(basename "$appimage_path")
          echo "appimage_path=$appimage_path" >> $GITHUB_OUTPUT
          echo "appimage_name=$appimage_name" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload AppImage
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.ensure_release.outputs.result }}
          asset_path: ${{ steps.find_appimage.outputs.appimage_path }}
          asset_name: ${{ steps.find_appimage.outputs.appimage_name }}
          asset_content_type: application/octet-stream

      - name: Find Deb
        id: find_deb
        run: |
          deb_path=$(ls src-tauri/target/${{ steps.set_target.outputs.triple }}/release/bundle/deb/*.deb)
          deb_name=$(basename "$deb_path")
          echo "deb_path=$deb_path" >> $GITHUB_OUTPUT
          echo "deb_name=$deb_name" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload Deb
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.ensure_release.outputs.result }}
          asset_path: ${{ steps.find_deb.outputs.deb_path }}
          asset_name: ${{ steps.find_deb.outputs.deb_name }}
          asset_content_type: application/octet-stream
