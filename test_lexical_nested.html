<!DOCTYPE html>
<html>
<head>
<style>
  .lexical-ul { list-style-type: disc; }
  .lexical-ol { list-style-type: decimal; }
  .lexical-nested-list { list-style-type: none; }
</style>
</head>
<body>
  <ul class="lexical-ul">
    <li>Outer item
      <ul class="lexical-ul lexical-nested-list">
        <li>Inner item</li>
      </ul>
    </li>
  </ul>
</body>
</html>
