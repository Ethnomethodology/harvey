# src-tauri/Cargo.toml

[package]
name = "harvey"
version = "0.1.0"
description = "A Desktop App for Audio/Video Transcription"
authors = ["Dipanjan Saha, Gemma Lough, Tatsuya Akutsu"]
edition = "2021"
license = "MIT"

[lib]
name = "harvey_1_lib" # This should match what's in tauri.conf.json under tauri.bundle.identifier if it's a library-based app
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
sha2 = "0.10"
hex = "0.4"
ureq = "2.9.7"
zip = "1.1.0"
anyhow = "1.0.86"
tar = "0.4"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies]
# --- Core Tauri v2 ---
tauri = { version = "2.0.0", features = [ "macos-private-api", "protocol-asset", "devtools"] } 

# --- Tauri v2 Plugins ---
tauri-plugin-dialog = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0" 
tauri-plugin-opener = "2.0.0"
tauri-plugin-global-shortcut = "2.0.0"
tauri-plugin-os = "2.0.0-beta.4"

# --- Serialization / Data Handling ---
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] } 
quick-xml = { version = "0.36", features = ["serialize", "serde"] }

# --- NLP ---
ort = "1.16.3"
rust_tokenizers = "7.0.1"
ndarray = "0.15.4"
ndarray-stats = "0.5.1"

# --- Utilities ---
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
dashmap = "5.5"
futures-util = "0.3" 
num_cpus = "1.16"
log = "0.4"
env_logger = "0.11"
base64 = "0.22" 
uuid = { version = "1.6", features = ["v4", "serde"] }
urlencoding = "2.1.3" 
regex = "1" # <--- MAKE SURE THIS LINE IS PRESENT AND CORRECT
walkdir = "2"
rusqlite = { version = "0.31.0", features = ["bundled"] }
dirs = "5.0.1"

# --- Asynchronous Runtime ---
tokio = { version = "1", features = ["full"] }

# --- Download / Network Feature Dependencies ---
reqwest = { version = "0.12", features = ["stream", "json"] } # Restored reqwest version
zip = "1.1"
html-escape = "0.2.13"
hf-hub = { version = "0.3.2", features = ["tokio"] }

csv = "1.3.1"
calamine = { version = "0.26.0", features = ["dates"] }
hound = "3.5"
rust_xlsxwriter = "0.61.0"
tokenizers = "0.22.1"

[dev-dependencies]
tempfile = "3.10.1"
