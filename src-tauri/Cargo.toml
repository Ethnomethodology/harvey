# src-tauri/Cargo.toml

[package]
name = "harvey"
version = "0.1.0"
description = "A Desktop App for Audio/Video Transcription"
authors = ["Dipanjan Saha, Gemma Lough, Tatsuya Akutsu"]
edition = "2021"

[lib]
name = "harvey_1_lib" # This should match what's in tauri.conf.json under tauri.bundle.identifier if it's a library-based app
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
# --- Core Tauri v2 ---
tauri = { version = "2.0.0", features = [ "protocol-asset", "devtools"] } 

# --- Tauri v2 Plugins ---
tauri-plugin-dialog = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0" 
tauri-plugin-opener = "2.0.0"

# --- Serialization / Data Handling ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0" 
quick-xml = { version = "0.36", features = ["serialize", "serde"] }

# --- Utilities ---
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
dashmap = "5.5"
futures-util = "0.3" 
num_cpus = "1.16"
log = "0.4"
env_logger = "0.11"
base64 = "0.22" 
uuid = { version = "1.6", features = ["v4", "serde"] } 
regex = "1" # <--- MAKE SURE THIS LINE IS PRESENT AND CORRECT

# --- Asynchronous Runtime ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

# --- Download / Network Feature Dependencies ---
reqwest = { version = "0.12", features = ["stream", "json"] }
zip = "1.1" 
html-escape = "0.2.13"

csv = "1.3.1"
calamine = { version = "0.26.0", features = ["dates"] }
